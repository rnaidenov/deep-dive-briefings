<script>
/* Add new topics at the top. slug = folder name. color: coral | sun | mint | sky | violet | pink */
var TOPICS = [
  { slug: 'electricity-gaggia', title: 'Electricity for the Gaggia', kicker: 'Machines', date: '2026-10-29', color: 'coral',
    blurb: 'Line, neutral, earth, jumpers and the three GaggiMate paths: just enough to work safely mid-install.', meta: '~3 min audio' },
  { slug: 'gaggia-gaggimate', title: 'Inside the Gaggia Classic Pro', kicker: 'Machines', date: '2026-10-28', color: 'sky',
    blurb: 'How water, heat and switches work in the stock E24, and what every GaggiMate wire changes.', meta: '~14 min audio' },
  { slug: 'espresso', title: 'Espresso, from the puck up', kicker: 'Coffee', date: '2026-10-21', color: 'coral',
    blurb: 'Extraction maths, flushing, temperature, 9 bar and flow vs pressure profiling, GaggiMate, puck prep and dialling in.', meta: '~11 min audio' },
  { slug: 'bg-president-2026', title: "Bulgaria's presidential election", kicker: 'Politics', date: '2026-10-21', color: 'mint',
    blurb: 'Neutral, sourced: what the president can do, the two-round rule, the candidates and the polls before the 25 Oct vote.', meta: '~13 min audio' },
  { slug: 'grinder', title: 'The grind, explained', kicker: 'Coffee', date: '2026-10-21', color: 'coral',
    blurb: 'What does a better grinder buy you for espresso? C3 Pro vs Sculptor 078S and alternatives.', meta: '~9 min audio' }
];

(function () {
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function date(iso) { var p = (iso || '').split('-'); return p.length === 3 ? +p[2] + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0] : esc(iso); }
  // Simple flat badge: tinted disc, solid disc, small navy dot.
  function art(c) {
    return '<svg class="topic-art" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" style="fill:var(--' + c + '-t)"/>' +
      '<circle cx="50" cy="50" r="30" style="fill:var(--' + c + ')"/><circle cx="62" cy="38" r="10" style="fill:var(--navy)"/></svg>';
  }
  var list = TOPICS.slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
  document.getElementById('topics').innerHTML = list.map(function (t) {
    var c = /^(coral|sun|mint|sky|violet|pink)$/.test(t.color) ? t.color : 'violet';
    return '<a class="card topic" href="' + encodeURI(t.slug) + '/">' + art(c) + '<div>' +
      '<span class="kicker" style="color:var(--' + c + '-d)">' + esc(t.kicker) + ' · ' + date(t.date) + '</span>' +
      '<h3>' + esc(t.title) + '</h3><p>' + esc(t.blurb) + (t.meta ? ' <b>' + esc(t.meta) + '</b>' : '') + '</p></div></a>';
  }).join('');
})();
</script>
